name: weekly job run

on:
  schedule:
    # Since March 2026 you can pin a timezone instead of doing UTC arithmetic.
    - cron: "0 7 * * 0"
      timezone: "Europe/London"
  workflow_dispatch:        # lets you trigger it by hand from the Actions tab
    inputs:
      resend_all:
        description: "Email every open role (skip collecting — takes seconds)"
        type: boolean
        default: false
      expand_firms:
        description: "Add every London finance/energy company from Companies House (needs CH_API_KEY)"
        type: boolean
        default: false
      report_everything:
        description: "Collect as usual, then email EVERY open role — no new-only filter, no minimum score, no cap"
        type: boolean
        default: false
      probe_ats:
        description: "Measure which ATS the unreachable firms use, then stop (~5 min, collects nothing)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # --- state, encrypted --------------------------------------------------
      # This repo is public, so jobs.db can't be committed in the clear — it
      # holds your search history, which firms you're tracking, and what you've
      # applied to. It lives here as an AES-256 blob instead, decrypted at the
      # start of each run and re-encrypted at the end. Set DB_PASSPHRASE in
      # repo secrets. Lose it and you lose the history, nothing else.
      - name: Decrypt database
        env:
          DB_PASSPHRASE: ${{ secrets.DB_PASSPHRASE }}
        run: |
          if [ -f jobs.db.gpg ] && [ -n "$DB_PASSPHRASE" ]; then
            gpg --batch --yes --quiet --passphrase "$DB_PASSPHRASE" \
                -o jobs.db -d jobs.db.gpg
            echo "restored $(du -h jobs.db | cut -f1) database"
          else
            echo "starting fresh (no jobs.db.gpg yet)"
          fi

      - name: Run pipeline
        env:
          # LinkedIn blocks datacentre IPs and GitHub's runners are the most
          # blocked of the lot — it answers 403 and JobSpy returns an empty
          # frame rather than raising, so it looks like "no jobs this week".
          # Run boards.py at home for LinkedIn coverage. This used to be a sed
          # against the text of weekly.sh, which would have stopped applying
          # the moment either file was edited, without saying so.
          NO_LINKEDIN: "1"
          PROBE_ATS: ${{ inputs.probe_ats }}
          RESEND_ALL: ${{ inputs.resend_all }}
          EXPAND_FIRMS: ${{ inputs.expand_firms }}
          REPORT_EVERYTHING: ${{ inputs.report_everything }}
          CH_API_KEY: ${{ secrets.CH_API_KEY }}
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          CAREERJET_AFFID: ${{ secrets.CAREERJET_AFFID }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}      # optional — notify.py defaults to 587
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          chmod +x weekly.sh
          # Reconnaissance, not collection: which ATS do the firms we cannot
          # reach actually use? Answers that and stops, so a week is not spent
          # building parsers for systems that turn out to be rare.
          if [ "$PROBE_ATS" = "true" ]; then
            python ats_probe.py --limit 300
            exit $?
          fi
          # Ticking "Email every open role" re-sends the digest from the restored
          # database without collecting anything. On the schedule this is empty.
          ARGS=""
          if [ "$RESEND_ALL" = "true" ]; then ARGS="$ARGS --resend-all"; fi
          if [ "$EXPAND_FIRMS" = "true" ]; then ARGS="$ARGS --expand-firms"; fi
          if [ "$REPORT_EVERYTHING" = "true" ]; then ARGS="$ARGS --report-all"; fi
          ./weekly.sh $ARGS

      - name: Encrypt and commit state
        if: always()
        env:
          DB_PASSPHRASE: ${{ secrets.DB_PASSPHRASE }}
        run: |
          if [ -f jobs.db ] && [ -n "$DB_PASSPHRASE" ]; then
            gpg --batch --yes --quiet --passphrase "$DB_PASSPHRASE" \
                -c --cipher-algo AES256 -o jobs.db.gpg jobs.db
          fi
          git config user.name  "job-run"
          git config user.email "actions@users.noreply.github.com"
          # GitHub disables scheduled workflows after 60 days with no NEW COMMITS.
          # Only commits count — not runs, not issues, not tags. Without this
          # heartbeat the schedule could switch off silently, with no error
          # anywhere, if a few runs in a row happened to change nothing.
          mkdir -p .github && date -u +%FT%TZ > .github/last-run
          # Staged separately on purpose: `git add a b` stages NOTHING if b is
          # missing, and jobs.db.gpg is missing on any run that failed before the
          # database existed — exactly the runs where the heartbeat matters most.
          git add -f .github/last-run
          [ -f jobs.db.gpg ] && git add -f jobs.db.gpg
          # Discovery answers, so the next run doesn't re-derive them. Without
          # this they are rebuilt weekly, which at thousands of firms is by far
          # the most expensive thing here.
          for f in sniffed.csv endpoints.csv no_ats.csv manual.csv unknown.csv firms.csv firm_check.csv; do
            [ -f "$f" ] && git add -f "$f"
          done
          true
          git commit -m "weekly run $(date -u +%F)" || echo "nothing to commit"
          # A plain `git push || true` loses the entire run silently when anyone
          # pushes to the branch while the run is going: the commit lands only on
          # the runner, which is then destroyed. That costs the database, the
          # discovery output and the domain verdicts — 85 minutes of work in the
          # case that prompted this. Rebase onto whatever arrived and retry,
          # preferring our generated state on conflict, and make a final failure
          # loud rather than swallowed.
          BRANCH="${GITHUB_REF_NAME}"
          PUSHED=""
          for attempt in 1 2 3; do
            if git push origin "HEAD:$BRANCH"; then PUSHED=1; break; fi
            echo "push rejected (attempt $attempt) — remote moved, rebasing onto it"
            git fetch origin "$BRANCH" || break
            # -X theirs during a rebase keeps the commit being replayed, i.e.
            # this run's freshly generated state, over the older remote copy
            git rebase -X theirs "origin/$BRANCH" || { git rebase --abort || true; }
          done
          if [ -z "$PUSHED" ]; then
            echo "::error::Could not push run state after 3 attempts. This run's database, discovery output and domain verdicts are lost. Re-run the workflow."
            exit 1
          fi

      # Reports are NOT committed — they'd expose what you're applying to.
      # 90-day artifact, visible only to you.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-${{ github.run_number }}
          path: |
            report.html
            report.md
            scored.csv
            ats_probe.csv
            rejects.csv
            logs/
          retention-days: 90

      - name: Warn on failure
        if: failure()
        run: echo "::warning::Weekly run reported failures — check the log artifact."
