# Scoring rubric. Every number here is a tunable. Raise what matters to you,
# drop what doesn't. score.py reads this at runtime — no code changes needed.

# --- 1. Title strength. First tier that matches wins. ---
title_tiers:
  student_only: # Zero on purpose. Graduate schemes, internships and placements
                # almost all require you to be a current undergraduate, usually
                # in your penultimate year, so they are not open to you however
                # well they match otherwise. Listed first, so a "Graduate
                # Commodity Analyst" takes this tier and earns nothing for its
                # title rather than scoring as core.
                # Set this to -1000 to drop them from the digest entirely.
    points: 0
    patterns:
      - "\\bgrad(uate)?s?\\b"
      - "\\b(intern|interns|internship)\\b"
      - "placement"
      - "apprentice\\w*"
      - "(summer|spring|winter|campus) (analyst|intern|programme|program|scheme)"
      - "analyst (programme|program|scheme)"
      - "off.?cycle"
      - "school leaver"
      - "penultimate"
      - "(year in industry|industrial year|sandwich (year|placement))"
      - "rotation(al)? (programme|program|scheme)"
  junior: # starting out, but not a student — this is the target
    points: 45
    patterns:
      - "\\bjunior\\b"
      - "entry.?level"
      - "trainee"
      - "\\banalyst i\\b"
      - "assistant (analyst|trader|broker)"
      - "associate analyst"
      - "early care"
  core: # exactly what you're going after
    points: 30
    patterns:
      - "commodit(y|ies) analyst"
      - "market analyst"
      - "trading analyst"
      - "fundamental(s)? analyst"
      - "supply (and|&) demand analyst"
      - "quantitative (analyst|research)"
      - "data scientist.*(trading|commodit|energy|market)"
      - "(power|gas|lng|crude|carbon|freight).{0,12}analyst"
      - "short.?term analyst"
      # config.yaml collects these; without them here they arrived scoring zero
      # for their title, which is how a prime target ends up mid-table
      - "(battery|storage|flexibilit|electricity|renewables?).{0,14}analyst"
      # Market-facing seats that are not spelled "analyst". Price reporting in
      # particular is the classic route onto a commodities desk without prior
      # desk experience, and it was scoring nothing for its title.
      - "market (analysis|intelligence|research)"
      - "price report\\w*|market report\\w*|price assess\\w*"
      - "\\breporter\\b.*(gas|power|oil|lng|metals?|carbon|freight|commodit)"
      - "(gas|power|oil|lng|metals?|carbon|freight|commodit\\w+).{0,14}reporter"
      - "(trade|market|transaction) surveillance"
      - "surveillance (analyst|analytics|quant)"
      - "market abuse"
      - "regulator(y)? analyst"
      - "regulation analyst"
      - "(transaction|regulatory|trade) reporting"
      - "\\b(emir|mifid|mifir|sftr)\\b"
      - "financial crime (analyst|analytics|data)"
      # the central-bank routes: closest thing to a lateral move from the FCA
      - "statistician"
      - "(prudential|banking|insurance|market|conduct|financial) supervis\\w*"
      - "supervis(ion|ory) (analyst|associate|specialist)"
      - "stress test\\w*"
      - "financial stability"
      - "(monetary|macroprudential|micro.?prudential) (policy|analysis|analyst)"
  strong: # same floor, one step off the target
    points: 20
    patterns:
      - "research analyst"
      - "energy analyst"
      - "desk analyst"
      - "junior trader"
      - "graduate trader"
      - "trainee trader"
      - "strats|systematic|alpha research|signals"
      - "pricing analyst"
      - "structur(er|ing) analyst"
      - "origination analyst"
      - "market modell?(er|ing)"
      - "energy modell?(er|ing)"
      # Front-office, market-facing, junior. Same floor as a research analyst:
      # these sit on or beside the desk and hire people without desk history.
      - "sales trader|trading sales|flow sales"
      - "front office (analyst|support|associate|developer)"
      - "market risk analyst"
      - "product control(ler)?"
      - "trade (floor|capture|surveillance|control) (analyst|associate)"
      - "(commodity|commodities|energy|power|gas|oil|freight|metals?) sales"
      - "origination (analyst|associate|graduate)"
      - "(physical|paper) (trading|oil|gas|power)"
      - "market (data|structure) analyst"
      - "asset optimi(s|z)ation"
      - "portfolio analyst"
      - "dispatch analyst"
      - "investment analyst"
      - "investment (research|associate)"
      - "infrastructure (investment )?analyst"
      - "(fund|credit|equity|fixed income) analyst"
      # physical ops and scheduling — the way onto a desk without desk experience
      - "(gas|power|oil|cargo|fuel|energy|crude|lng) (scheduler|scheduling|operator)"
      - "(trading|trade|commodit\\w*|energy|cargo|vessel|freight|shipping) operations"
      - "trade (capture|lifecycle|execution)"
      - "demurrage|post.?fixture|nominations? analyst"
      # risk beside the desk
      - "(market|commodity|commodities|trading|price) risk"
      - "model validation|\\bxva\\b"
      # energy commercial, economics, shipping desk
      - "commercial analyst"
      - "\\bppa\\b|route.to.market"
      - "econom(ist|ics analyst)"
      - "(sale and purchase|s(and|&)p) broker|shipbroking"
      - "(dry cargo|tanker|container|gas) broker"
  adjacent: # worth a look, not the target
    # "quantitative developer", "machine learning", "analytics engineer" and
    # "python developer" were removed rather than demoted. They are software
    # engineering roles: 30% of a 99-role digest wanted a CS or doctoral
    # background against 14% explicitly junior, which is the opposite of the
    # brief. They are still COLLECTED — config.yaml keeps them — so they appear
    # below the shortlist rather than vanishing, and can be restored by adding
    # the patterns back here.
    points: 10
    patterns:
      - "data scientist"
      - "data analyst"
      - "market data"
      - "market intelligence"
      - "price report|market report"
      - "product control|p(and|&)l analyst|valuations? analyst"
      - "esg (analyst|analytics|data|research)"
      - "sustainability (analyst|reporting|data)"
      - "climate (risk )?analyst"
      - "underwrit(er|ing) (analyst|assistant|technician|graduate)"
      - "catastrophe model|exposure management|actuarial analyst"
      - "investment banking|m(and|&)a analyst|leveraged finance"
      - "(debt|equity) capital markets|corporate finance analyst"
      - "risk analyst"
      - "corporate development analyst|strategy analyst"

# --- 2. Seniority. Years are read out of the description by verify.py. ---
seniority:
  junior_markers: 35      # junior / graduate / trainee / entry / intern / campus.
                          # Deliberately the largest single number in the rubric:
                          # a role that says it wants someone starting out beats
                          # a better-titled one that doesn't.
  no_marker: 3            # title says nothing either way — fine, but no longer
                          # nearly as good as one that says "graduate"
  years_cap: 2            # more than this many years required and it's not for you
  over_cap_penalty: -40
  per_year_over: -8       # additional, per year above the cap
  # A doctorate gates a role harder than any number of years does, and nothing
  # scored it: 18 of 99 shortlisted roles were PhD quant research, ranking level
  # with roles actually open to you. Not a hard exclude — a fund that says "PhD
  # preferred" often still hires numerate analysts, so it drops down the list
  # rather than vanishing. A PhD in the TITLE is a doctoral intake, so that one
  # is heavy enough to clear the shortlist threshold on its own.
  phd_in_title: -60
  phd_required: -45
  phd_preferred: -12

  exclude_over_years: 2   # hard drop, not a penalty: a role demanding more than
                          # this never reaches the digest at all. Only applies
                          # where verify.py actually read a number out of the
                          # description — unread roles fall back to the penalty
                          # above. Raise it to see more, blank it to disable.

# --- 3. Firm type. Where you realistically convert fastest scores highest. ---
firm_categories:
  regulator: 15         # Bank of England, PRA, Ofgem, ONS, FCA — where a
                        # regulatory data background is the qualification rather
                        # than a bonus, and the hiring bar is a numerate analyst
                        # rather than a quant. Raised from 11: this is the single
                        # most convertible category and it was ranking below
                        # data vendors and flex optimisers.
  data_vendor: 12
  flex_optimiser: 12
  power_gas: 10
  trading_house: 10
  crypto: 9
  prop_mm: 8
  softs: 8
  major: 7
  refining: 7
  lng: 7
  fund: 7
  broker: 6
  exchange: 6
  metals: 6
  carbon: 6
  bunkers: 5
  shipbroker: 5
  shipping: 5           # owners and operators, not brokers
  bank: 5
  insurance: 4          # marine and energy underwriting is the relevant corner
  consultancy: 4
  recruiter: 3
  unknown: 2

# --- 3b. Firm type x role type. ---
# Title tiers score the job and firm_categories scores the employer, but neither
# can say "this KIND of role at this KIND of firm". A data scientist post is
# adjacent-tier work at a hedge fund and the single most convertible opening
# there is at the Bank of England or the PRA, and both were scoring the same.
firm_role_bonus:
  regulator:
    points: 22
    patterns:
      - "data (scientist|analyst|engineer|governance)"
      - "statistician"
      - "econom(ist|ics)"
      - "\\banalyst\\b"
      - "research"
      - "quantitative"
      - "supervis\\w*"
      - "policy"

# Below this many characters a stored description is treated as unreadable and
# NONE of the signals below are scored. verify.py stores whatever came back, and
# on a JS-rendered or walled page that is a cookie banner, not a job spec. A real
# job description is comfortably over this; the failures are all far under it.
min_jd_chars: 400

# --- 4. Description signals. Each fires once. ---
description_signals:
  # A role that requires a language you do not have is not a role you can take,
  # however well it matches otherwise. "German Speaking Junior Power Analyst"
  # was the single highest-scoring job in a digest at 158, and "Mandarin
  # speaking Junior Treasury Dealer" and "Bilingual Japanese/English Required"
  # were both in the top twenty. Penalised rather than excluded, because some
  # of these say "German a plus" and are genuinely open — they now rank below
  # every role that does not ask, which is where they belong.
  foreign_language_required:
    points: -55
    patterns:
      - "(german|french|spanish|italian|dutch|portuguese|polish|russian|mandarin|cantonese|japanese|korean|arabic|hebrew|turkish|greek|swedish|norwegian|danish|finnish|czech|hungarian|romanian)[ -](speaking|speaker|language|native|fluent|fluency|bilingual)"
      - "(fluen(t|cy)|native|bilingual|proficien(t|cy)) (in |level )?(german|french|spanish|italian|dutch|portuguese|polish|russian|mandarin|cantonese|japanese|korean|arabic|hebrew|turkish|greek)"
      - "must (be able to )?(speak|be fluent)"
      - "(bilingual|trilingual) [a-z]+ ?/ ?(english|eng)\\b"
      - "\\b(english|eng) ?/ ?(german|french|spanish|mandarin|japanese|korean|arabic)\\b"
      - "\\b(german|french|spanish|mandarin|japanese|korean|arabic) ?(and|&|/) ?english (fluency|required)"

  python_sql:
    points: 8
    patterns: ["python", "\\bsql\\b", "pandas", "numpy"]
  ml_stats:
    points: 6
    patterns: ["machine learning", "statistic", "forecasting model", "time series"]
  domain:
    points: 8
    patterns: ["commodit", "energy market", "power market", "crude", "lng", "refinery",
               "freight", "carbon", "gas market", "electricity"]
  regulatory_edge:   # your actual differentiator — an FCA data analyst reading
                     # the other side of these submissions is the person these
                     # roles are written for. Raised from 10: this stacks on top
                     # of the title tier, so a Junior Surveillance Analyst clears
                     # everything else in the digest, which is correct.
    points: 18
    patterns: ["remit", "emir", "mifid", "mifir", "sftr", "market abuse",
               "surveillance", "regulator", "compliance framework", "\\bfca\\b",
               "transaction reporting", "regulatory reporting", "trade reporting",
               "financial crime", "market integrity", "conduct risk",
               "\\bpra\\b", "esma", "supervis"]
  trading_exposure:
    points: 6
    patterns: ["trading desk", "front office", "traders", "p&l", "position", "hedg"]
  no_experience_needed:   # the description saying so, rather than the title.
                          # Nothing student-specific here — no "graduate",
                          # "penultimate year" or "placement" — those describe
                          # who the role is open to, not how much experience it
                          # wants, and they are not open to you.
    points: 25
    patterns: ["no prior experience", "no experience (is )?(necessary|required)",
               "entry level", "we will train", "full training",
               "training (programme|program) provided", "early care",
               "0-2 years", "1-2 years", "0-1 year", "up to 2 years",
               "no previous", "all backgrounds", "career chang",
               "will consider candidates", "transferable skills"]

# --- 5. Provenance. Applying direct beats going through an agency. ---
# The firm's own careers page is the most direct route there is, so it scores
# with the ATS boards rather than below them. These five were missing entirely,
# which meant a role read off the employer's own site defaulted to 0 — the same
# weight as Glassdoor. jsonld/embedded/html are that site read three ways;
# oracle and eightfold are enterprise boards added later and overlooked here.
source_weights:
  jsonld: 8
  embedded: 8
  html: 7
  greenhouse: 8
  lever: 8
  ashby: 8
  workday: 8
  oracle: 8
  eightfold: 7
  smartrecruiters: 7
  workable: 7
  recruitee: 7
  teamtailor: 7
  personio: 7
  breezy: 7
  bamboohr: 7
  rippling: 7
  pinpoint: 7
  comeet: 7
  jobvite: 7
  bullhorn: 2
  reed: 0
  adzuna: 0
  jooble: 0
  careerjet: 0
  linkedin: 2
  indeed: 0
  glassdoor: 0
  google: 1
  efinancialcareers: 2

# --- 5b. Geography, scored rather than only filtered. ---
# The location filter cannot fire on a row with no location, and page-read rows
# very often have none — the digest shows "location n/a". That is how Centrica's
# Aalborg scheduler scored 90, Volcafe's Dar es Salaam trading assistant 93, and
# Enovos' Luxembourg internship 69, all in one digest.
#
# The city is almost always still there, in the title or in the URL:
#   .../Centrica/job/Aalborg/Trading-Operations-Power-Scheduler
#   .../job/New-York-Credit-Portfolio-Risk-Analyst-NY-10172
#   Trading Assistant | Volcafe | Dar es Salaam, Tanzania
# so all three fields are read, using the same patterns config.yaml filters on.
#
# Scored, not dropped: a stated London role earns, an evidently foreign one is
# pushed below everything real, and one with nothing to go on takes a small
# knock for the uncertainty rather than being thrown away — plenty of genuine
# London roles simply do not state a location.
geography:
  uk_confirmed: 10
  outside_uk: -50
  not_stated: -8

# --- 6. Freshness, in days since posted ---
freshness:
  - [7, 8]
  - [21, 4]
  - [45, 0]
  - [90, -6]
  - [9999, -12]

# --- 7. Verification. This is the part that stops you wasting applications. ---
verification:
  live: 15
  unverified: -10
  dead: -1000            # effectively removes it
  title_mismatch: -20    # URL resolved to something that isn't this job
  anonymous_employer: -8 # "a leading commodity trading house"
  expired_validthrough: -30
  ghost_repost: -15      # same role posted repeatedly over months
  long_open: -6          # live for 60+ days with no close date
  exclude_days_open: 120 # hard drop, not a penalty: a role advertised this long
                         # with no closing date is an evergreen pipeline advert,
                         # not a vacancy. Measured from the posting's own date,
                         # so it is unaffected by how long this database has
                         # existed; roles with a stated close date are exempt.
                         # Blank it to disable.

# --- 8. Report ---
report:
  # top_n caps each of the two sections, so the digest carries up to 2x this.
  # It was 25, which on a normal weekly run was the binding constraint long
  # before min_score was — the email showed 25 roles out of a 130-role pool
  # and nothing said the other 105 existed.
  # One firm's careers page should not eat the digest: four firms held 25 of 99
  # shortlist slots while 55 others shared the rest. Overflow is not dropped —
  # it falls through to the section below the shortlist.
  max_per_firm: 3
  # If fewer than this many roles arrived since the last run, top the digest up
  # with the best still-open ones. A weekly run rarely needs it; running twice
  # in a day otherwise produces an email covering five hours of hiring, which
  # reads as a broken scraper rather than as yesterday's work already seen.
  # Set to 0 for a strictly new-since-last-run digest.
  backfill_to: 60
  top_n: 60
  min_score: 20
  shortlist_threshold: 60
