# Scoring rubric. Every number here is a tunable. Raise what matters to you,
# drop what doesn't. score.py reads this at runtime — no code changes needed.

# --- 1. Title strength. First tier that matches wins. ---
title_tiers:
  student_only: # Zero on purpose. Graduate schemes, internships and placements
                # almost all require you to be a current undergraduate, usually
                # in your penultimate year, so they are not open to you however
                # well they match otherwise. Listed first, so a "Graduate
                # Commodity Analyst" takes this tier and earns nothing for its
                # title rather than scoring as core.
                # Set this to -1000 to drop them from the digest entirely.
    points: 0
    patterns:
      - "\\bgrad(uate)?s?\\b"
      - "\\b(intern|interns|internship)\\b"
      - "placement"
      - "apprentice\\w*"
      - "(summer|spring|winter|campus) (analyst|intern|programme|program|scheme)"
      - "analyst (programme|program|scheme)"
      - "off.?cycle"
      - "school leaver"
      - "penultimate"
      - "(year in industry|industrial year|sandwich (year|placement))"
      - "rotation(al)? (programme|program|scheme)"
  junior: # starting out, but not a student — this is the target
    points: 45
    patterns:
      - "\\bjunior\\b"
      - "entry.?level"
      - "trainee"
      - "\\banalyst i\\b"
      - "assistant (analyst|trader|broker)"
      - "associate analyst"
      - "early care"
  core: # exactly what you're going after
    points: 30
    patterns:
      - "commodit(y|ies) analyst"
      - "market analyst"
      - "trading analyst"
      - "fundamental(s)? analyst"
      - "supply (and|&) demand analyst"
      - "quantitative (analyst|research)"
      - "data scientist.*(trading|commodit|energy|market)"
      - "(power|gas|lng|crude|carbon|freight).{0,12}analyst"
      - "short.?term analyst"
      # config.yaml collects these; without them here they arrived scoring zero
      # for their title, which is how a prime target ends up mid-table
      - "(battery|storage|flexibilit|electricity|renewables?).{0,14}analyst"
      - "(trade|market|transaction) surveillance"
      - "surveillance (analyst|analytics|quant)"
      - "market abuse"
      - "regulator(y)? analyst"
      - "regulation analyst"
  strong: # same floor, one step off the target
    points: 20
    patterns:
      - "research analyst"
      - "energy analyst"
      - "desk analyst"
      - "junior trader"
      - "graduate trader"
      - "trainee trader"
      - "strats|systematic|alpha research|signals"
      - "quantitative developer"
      - "pricing analyst"
      - "structur(er|ing) analyst"
      - "origination analyst"
      - "market modell?(er|ing)"
      - "energy modell?(er|ing)"
      - "asset optimi(s|z)ation"
      - "portfolio analyst"
      - "dispatch analyst"
  adjacent: # worth a look, not the target
    points: 10
    patterns:
      - "data scientist"
      - "data analyst"
      - "analytics engineer"
      - "machine learning"
      - "market data"
      - "python developer"
      - "market intelligence"
      - "price report|market report"

# --- 2. Seniority. Years are read out of the description by verify.py. ---
seniority:
  junior_markers: 35      # junior / graduate / trainee / entry / intern / campus.
                          # Deliberately the largest single number in the rubric:
                          # a role that says it wants someone starting out beats
                          # a better-titled one that doesn't.
  no_marker: 3            # title says nothing either way — fine, but no longer
                          # nearly as good as one that says "graduate"
  years_cap: 2            # more than this many years required and it's not for you
  over_cap_penalty: -40
  per_year_over: -8       # additional, per year above the cap
  exclude_over_years: 2   # hard drop, not a penalty: a role demanding more than
                          # this never reaches the digest at all. Only applies
                          # where verify.py actually read a number out of the
                          # description — unread roles fall back to the penalty
                          # above. Raise it to see more, blank it to disable.

# --- 3. Firm type. Where you realistically convert fastest scores highest. ---
firm_categories:
  regulator: 11         # Ofgem, FCA, National Grid — where your REMIT and market
                        # surveillance background is the qualification, not a bonus
  data_vendor: 12
  flex_optimiser: 12
  power_gas: 10
  trading_house: 10
  crypto: 9
  prop_mm: 8
  softs: 8
  major: 7
  refining: 7
  lng: 7
  fund: 7
  broker: 6
  exchange: 6
  metals: 6
  carbon: 6
  bunkers: 5
  shipbroker: 5
  shipping: 5           # owners and operators, not brokers
  bank: 5
  insurance: 4          # marine and energy underwriting is the relevant corner
  consultancy: 4
  recruiter: 3
  unknown: 2

# --- 4. Description signals. Each fires once. ---
description_signals:
  python_sql:
    points: 8
    patterns: ["python", "\\bsql\\b", "pandas", "numpy"]
  ml_stats:
    points: 6
    patterns: ["machine learning", "statistic", "forecasting model", "time series"]
  domain:
    points: 8
    patterns: ["commodit", "energy market", "power market", "crude", "lng", "refinery",
               "freight", "carbon", "gas market", "electricity"]
  regulatory_edge:   # your actual differentiator — regulator + data
    points: 10
    patterns: ["remit", "emir", "mifid", "market abuse", "surveillance", "regulator",
               "compliance framework", "fca"]
  trading_exposure:
    points: 6
    patterns: ["trading desk", "front office", "traders", "p&l", "position", "hedg"]
  no_experience_needed:   # the description saying so, rather than the title.
                          # Nothing student-specific here — no "graduate",
                          # "penultimate year" or "placement" — those describe
                          # who the role is open to, not how much experience it
                          # wants, and they are not open to you.
    points: 25
    patterns: ["no prior experience", "no experience (is )?(necessary|required)",
               "entry level", "we will train", "full training",
               "training (programme|program) provided", "early care",
               "0-2 years", "1-2 years", "0-1 year", "up to 2 years",
               "no previous", "all backgrounds", "career chang",
               "will consider candidates", "transferable skills"]

# --- 5. Provenance. Applying direct beats going through an agency. ---
source_weights:
  greenhouse: 8
  lever: 8
  ashby: 8
  workday: 8
  smartrecruiters: 7
  workable: 7
  recruitee: 7
  teamtailor: 7
  personio: 7
  breezy: 7
  bamboohr: 7
  rippling: 7
  pinpoint: 7
  comeet: 7
  jobvite: 7
  bullhorn: 2
  reed: 0
  adzuna: 0
  jooble: 0
  careerjet: 0
  linkedin: 2
  indeed: 0
  glassdoor: 0
  google: 1
  efinancialcareers: 2

# --- 6. Freshness, in days since posted ---
freshness:
  - [7, 8]
  - [21, 4]
  - [45, 0]
  - [90, -6]
  - [9999, -12]

# --- 7. Verification. This is the part that stops you wasting applications. ---
verification:
  live: 15
  unverified: -10
  dead: -1000            # effectively removes it
  title_mismatch: -20    # URL resolved to something that isn't this job
  anonymous_employer: -8 # "a leading commodity trading house"
  expired_validthrough: -30
  ghost_repost: -15      # same role posted repeatedly over months
  long_open: -6          # live for 60+ days with no close date

# --- 8. Report ---
report:
  top_n: 25
  min_score: 25
  shortlist_threshold: 60
