# Job filter config. Matching is case-insensitive regex against the job title.
# A job is kept if it matches ANY include pattern and NO exclude pattern.

locations:
  # Keep jobs whose location matches any of these, or has no location field.
  # Written out rather than left at london/uk: employers label London roles
  # "EC2M, England", "Canary Wharf", "GB" and "EMEA" often enough that the
  # short list was dropping them silently. `uk` was also unanchored, which
  # let every Ukraine posting through.
  - london
  - united kingdom
  - "\\buk\\b"
  - "\\bgb\\b"
  - great britain
  - england
  - canary wharf
  - "\\b(ec[1-4]|wc[12]|e14|e1|sw1|w1[a-z]?)[a-z]?\\b"   # City / Docklands / West End postcodes
  - "\\bemea\\b"
  - remote
  - hybrid

# Checked BEFORE `locations` and it wins outright. "remote" and "hybrid" are in
# the list above so UK remote roles are kept, but bare substring matching means
# "Remote - India", "Remote, United States" and "Hybrid - New York" matched too,
# and roughly one in eight shortlisted roles was somewhere you cannot work.
# Matched against the title as well as the location, because a lot of postings
# carry no location field at all and say "Analyst, Mumbai" in the title instead.
# A UK marker in the location beats everything below it. Without that override,
# "London, New York, Singapore" — how multi-office funds advertise a London seat —
# was dropped outright, and that is roughly five of every hundred shortlisted.
# Deliberately excludes remote/hybrid/emea: "Remote United States of America"
# must not count as a UK marker.
uk_markers:
  - "london|united kingdom|great britain|england|canary wharf"
  - "\\b(uk|gb)\\b"
  - "\\b(ec[1-4]|wc[12]|e14|e1|sw1|w1[a-z]?)[a-z]?\\b"

# City names are decisive, and are matched against the TITLE as well: postings
# with no location field say "Prices Data Analyst - Mumbai" in the title instead.
# Every alternative is \b-anchored — unanchored, "lima" matched c-LIMA-te and
# threw out Climate Risk Analyst.
location_exclude_cities:
  - "\\b(toronto|vancouver|montreal|ottawa)\\b"
  - "\\b(mumbai|bangalore|bengaluru|delhi|hyderabad|pune|gurgaon|chennai)\\b"
  - "\\b(sao paulo|s\u00e3o paulo|rio de janeiro|buenos aires|bogota|bogot\u00e1|santiago|lima)\\b"
  - "\\b(new york|nyc|manhattan|brooklyn|stamford|san francisco|chicago|boston|austin)\\b"
  - "\\b(seattle|houston|atlanta|denver|miami|dallas|philadelphia|charlotte|minneapolis)\\b"
  - "\\b(los angeles|san diego|phoenix|washington d\\.?c\\.?)\\b"
  - "\\b(singapore|hong kong|shanghai|beijing|shenzhen|tokyo|osaka|seoul|taipei)\\b"
  - "\\b(sydney|melbourne|brisbane|perth|auckland|wellington)\\b"
  - "\\b(dubai|abu dhabi|doha|riyadh|bahrain|kuwait)\\b"
  - "\\b(berlin|frankfurt|munich|hamburg|dusseldorf|d\u00fcsseldorf)\\b"
  - "\\b(paris|lyon|marseille|madrid|barcelona|valencia)\\b"
  - "\\b(amsterdam|rotterdam|the hague|utrecht|brussels|antwerp)\\b"
  # Cities that actually leaked into a digest, ranking above real London roles
  # because the row carried no location field and nothing else named the place.
  - "\\b(aalborg|aarhus|copenhagen|odense|malm(o|ö)|gothenburg|stockholm)\\b"
  - "\\b(oslo|bergen|stavanger|helsinki|espoo|tallinn|riga|vilnius|reykjavik)\\b"
  - "\\b(esch.sur.alzette|luxembourg|geneva|gen(e|è)ve|zurich|z(u|ü)rich|zug|basel|lausanne)\\b"
  - "\\b(milan|milano|rome|roma|turin|athens|lisbon|porto|vienna|wien|graz)\\b"
  - "\\b(prague|praha|warsaw|warszawa|krakow|budapest|bucharest|sofia|bratislava)\\b"
  - "\\b(dar es salaam|nairobi|lagos|abuja|accra|cairo|casablanca|johannesburg|cape town)\\b"
  - "\\b(bremen|cologne|k(o|ö)ln|stuttgart|essen|leipzig|hannover|nuremberg)\\b"
  - "\\b(kuala lumpur|jakarta|manila|bangkok|ho chi minh|hanoi|dhaka|karachi|colombo)\\b"
  - "\\b(tel aviv|istanbul|ankara|nicosia|valletta|monaco|gibraltar)\\b"
  - "\\b(zurich|z\u00fcrich|geneva|gen\u00e8ve|\\bzug\\b|basel|lausanne)\\b"
  - "\\b(warsaw|krakow|krak\u00f3w|wroclaw|bucharest|budapest|prague|bratislava|sofia)\\b"
  - "\\b(dublin|cork|milan|milano|rome|roma|turin|lisbon|porto)\\b"
  - "\\b(stockholm|copenhagen|oslo|helsinki|vienna|athens|istanbul|ankara|nicosia)\\b"
  - "\\b(johannesburg|cape town|lagos|abuja|nairobi|cairo|mexico city)\\b"

# Countries and market names. Location only, NEVER the title: "US Power Markets
# Analyst" and "European Gas Analyst" are ordinary London jobs, and matching
# those against the title would throw away exactly the desks worth having.
location_exclude_regions:
  - "\\b(united states|usa|u\\.s\\.a?\\.|us)\\b"
  - "\\b(canada|india|brazil|brasil|mexico|argentina|chile|colombia|peru)\\b"
  - "\\b(china|japan|korea|taiwan|australia|new zealand)\\b"
  - "\\b(uae|qatar|saudi arabia|israel)\\b"
  - "\\b(germany|france|spain|netherlands|belgium|switzerland|austria)\\b"
  - "\\b(poland|romania|hungary|czech republic|czechia|slovakia|bulgaria)\\b"
  - "\\b(ireland|italy|portugal|sweden|denmark|norway|finland|iceland|greece|turkey|cyprus)\\b"
  - "\\b(south africa|nigeria|kenya|egypt|ghana|morocco|tanzania|uganda)\\b"
  - "\\b(luxembourg|malta|monaco|estonia|latvia|lithuania|croatia|slovenia|serbia)\\b"
  - "\\b(malaysia|indonesia|philippines|vietnam|thailand|bangladesh|pakistan|sri lanka)\\b"
  # US grid operators — they turn up where a city would be
  - "\\b(nyiso|ercot|caiso|miso|pjm|spp|isone|iso-ne|aeso|wecc)\\b"

include:
  # --- market / fundamental analyst ---
  - "market analyst"
  - "commodit(y|ies) analyst"
  - "fundamental(s)? analyst"
  - "supply (and|&) demand analyst"
  - "balances analyst"
  - "short.?term analyst"
  - "load forecast"
  - "weather analyst"
  - "carbon (markets? )?analyst"
  - "power analyst"
  - "gas analyst"
  - "lng analyst"
  - "crude analyst"
  - "refin(ed|ery) (products )?analyst"
  - "freight analyst"
  - "shipping analyst"
  - "energy analyst"
  - "research analyst"
  - "market research"
  - "market intelligence"
  - "price report"
  - "market report"

  # --- flexibility, storage and renewables ---
  # The fastest-hiring corner of UK power advertises in its own vocabulary and
  # almost never uses the word "commodities".
  - "storage analyst"
  - "flexibility analyst"
  - "optimi(s|z)ation analyst"
  - "asset optimi(s|z)"
  # "battery" and "electricity" alone also collect battery technicians and meter
  # readers, so both must sit next to something that makes it a markets job
  - "battery (storage|optimi|market|trading|analy)"
  - "electricity (market|trading|analy|price|demand|balanc)"
  - "renewables? analyst"
  - "market modell?(er|ing)"
  - "energy modell?(er|ing)"
  - "portfolio analyst"
  - "dispatch analyst"

  # --- regulatory / surveillance ---
  # Where a REMIT and market-abuse background is the qualification itself.
  # Scoped: bare "surveillance" is mostly CCTV and store security.
  - "(trade|market|transaction|abuse) surveillance"
  - "surveillance (analyst|analytics|quant)"
  - "market abuse"
  - "regulatory analyst"
  - "regulation analyst"
  - "\\bremit\\b"
  # The FCA-to-industry routes proper. Transaction reporting is the closest
  # thing to a straight lateral move there is: the firms doing it are staffed
  # by people who used to read the other side of the same submissions.
  - "(transaction|regulatory|trade|prudential) reporting"
  - "\\b(emir|mifid|mifir|sftr|dodd.?frank)\\b"
  - "reporting (analyst|analytics|specialist)"
  - "financial crime (analyst|analytics|data)"
  - "compliance (data|analytics|technology|systems) analyst"
  - "conduct (risk )?analyst"
  - "regulatory (affairs|change|policy) analyst"
  # --- central bank / financial authority vocabulary ---
  # How the Bank of England, the PRA, ONS and the FCA actually title roles.
  # None of these existed, so a BoE data or supervision post was collected only
  # if it happened to say "analyst" next to a markets word.
  - "statistician"
  - "(prudential|banking|insurance|firm|market|conduct|financial) supervis\\w*"
  - "supervis(ion|ory) (analyst|associate|specialist|examiner)"
  - "stress test\\w*"
  - "data governance"
  - "(market|credit|model|prudential|financial|liquidity|conduct|operational) risk specialist"
  - "risk specialist.{0,22}(market|credit|model|prudential|financial|liquidity|conduct)"
  - "financial stability"
  - "(monetary|macroprudential|micro.?prudential) (policy|analysis|analyst)"

  # --- physical operations and scheduling ---
  # The classic way into a commodity desk without desk experience. Every pattern
  # is scoped to the trade: a bare "scheduler" or "operator" is buses and forklifts.
  - "(gas|power|oil|cargo|fuel|energy|crude|lng) (scheduler|scheduling|operator)"
  - "(trading|trade|commodit\\w*|energy|cargo|vessel|freight|shipping|physical) operations"
  - "trade (capture|lifecycle|execution|control)"
  - "deal (capture|desk)"
  - "nominations? (analyst|specialist)"
  - "demurrage"
  - "post.?fixture"
  - "operations analyst.{0,20}(trading|commodit|energy|freight|shipping)"

  # --- risk beside the desk ---
  # "credit risk" stays excluded below; market and commodity risk are a different
  # job that sits next to the traders and hires juniors constantly.
  - "(market|commodity|commodities|trading|price|liquidity) risk"
  - "risk analyst"
  - "model validation"
  - "\\bxva\\b"

  # --- product control and valuations ---
  - "product control"
  - "p(and|&)l (analyst|control)"
  - "valuations? (analyst|control)"

  # --- economics, ESG and climate ---
  - "econom(ist|ics analyst)"
  - "economic analyst"
  - "esg (analyst|analytics|data|research)"
  - "sustainability (analyst|reporting|data)"
  - "climate (risk )?analyst"

  # --- energy commercial and route to market ---
  - "commercial analyst"
  - "\\bppa\\b"
  - "route.to.market"
  - "corporate development analyst"
  - "strategy analyst"

  # --- insurance front office ---
  # 54 insurance firms in the registry were producing nothing at all.

  # --- banking front office ---
  - "investment banking"
  - "m(and|&)a analyst"
  - "leveraged finance"
  - "(debt|equity) capital markets"
  - "corporate finance analyst"

  # --- shipping desk ---
  - "(sale and purchase|s(and|&)p) broker"
  - "(dry cargo|tanker|container|gas) broker"
  - "shipbroking"

  # --- investment side ---
  # 387 fund firms in the registry were producing almost nothing, because none
  # of their analyst titles matched any pattern above.
  - "investment analyst"
  - "investment (research|associate)"
  - "fund analyst"
  - "credit analyst"
  - "fixed income analyst"
  - "equity analyst"
  - "infrastructure (investment )?analyst"
  - "portfolio (analyst|associate)"

  # --- early career, whatever the discipline ---
  # The point of the whole exercise. These are collected on the strength of the
  # programme alone, because a graduate scheme rarely names the desk in its title.
  # Each of these must name the discipline as well as the stage. Unscoped,
  # "trainee" collects dental nurses and driving instructors, "apprentice"
  # collects chefs and plumbers, and "placement" collects nursing coordinators.
  - "trainee.{0,20}(trader|analyst|broker|dealer|quant)"
  - "(trading|commodit|energy|market|shipping|chartering).{0,20}trainee"
  # Scoped, all three. Bare, "entry level" collected Entry Level Chef, Nurse and
  # Driver — and an "Operator I: Entry Level Operator" on a factory floor in
  # Enfield, which scored 154 and came top of a 99-role digest. "early care"
  # also matched early-years childcare and "school leaver" matched apprentice
  # plumbers. Same bug as bare "battery" and bare "trainee"; these were missed.
  - "entry.?level.{0,24}(analyst|trader|trading|broker|quant|research|market|data|risk|financ|invest|energy|commodit|econom|portfolio|deriv|equit|credit|bank)"
  - "(analyst|trader|trading|broker|quant|research|market|data|risk|financ|invest|energy|commodit|econom|portfolio|deriv|equit|credit|bank).{0,24}entry.?level"
  - "early care\\w*.{0,24}(analyst|trader|trading|broker|quant|research|market|data|risk|financ|invest|energy|commodit|econom|portfolio|deriv|equit|credit|bank)"
  - "(analyst|trader|trading|broker|quant|research|market|data|risk|financ|invest|energy|commodit|econom|portfolio|deriv|equit|credit|bank).{0,24}early care"
  - "school leaver.{0,24}(analyst|trader|trading|broker|quant|research|market|data|risk|financ|invest|energy|commodit|econom|portfolio|deriv|equit|credit|bank)"
  # unambiguous as an exact phrase — always an early-careers intake, never a
  # trade apprenticeship, unlike a bare "school leaver" followed by a job
  - "new grad\\w*.{0,24}(analyst|trader|trading|broker|quant|research|market|data|risk|financ|invest|energy|commodit|econom|portfolio|deriv|equit|credit|bank)"

  # --- desk / front office ---
  - "trading analyst"
  - "trade analyst"
  - "desk analyst"
  - "junior trader"
  - "graduate trader"
  - "trainee trader"
  - "assistant trader"
