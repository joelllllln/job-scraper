# Job filter config. Matching is case-insensitive regex against the job title.
# A job is kept if it matches ANY include pattern and NO exclude pattern.

locations:
  # Keep jobs whose location matches any of these, or has no location field.
  - london
  - united kingdom
  - uk
  - remote
  - hybrid

include:
  # --- market / fundamental analyst ---
  - "market analyst"
  - "commodit(y|ies) analyst"
  - "fundamental(s)? analyst"
  - "supply (and|&) demand analyst"
  - "balances analyst"
  - "short.?term analyst"
  - "load forecast"
  - "weather analyst"
  - "carbon (markets? )?analyst"
  - "power analyst"
  - "gas analyst"
  - "lng analyst"
  - "crude analyst"
  - "refin(ed|ery) (products )?analyst"
  - "freight analyst"
  - "shipping analyst"
  - "energy analyst"
  - "research analyst"
  - "market research"
  - "market intelligence"
  - "price report"
  - "market report"

  # --- flexibility, storage and renewables ---
  # The fastest-hiring corner of UK power advertises in its own vocabulary and
  # almost never uses the word "commodities".
  - "storage analyst"
  - "flexibility analyst"
  - "optimi(s|z)ation analyst"
  - "asset optimi(s|z)"
  # "battery" and "electricity" alone also collect battery technicians and meter
  # readers, so both must sit next to something that makes it a markets job
  - "battery (storage|optimi|market|trading|analy)"
  - "electricity (market|trading|analy|price|demand|balanc)"
  - "renewables? analyst"
  - "market modell?(er|ing)"
  - "energy modell?(er|ing)"
  - "portfolio analyst"
  - "dispatch analyst"

  # --- regulatory / surveillance ---
  # Where a REMIT and market-abuse background is the qualification itself.
  # Scoped: bare "surveillance" is mostly CCTV and store security.
  - "(trade|market|transaction|abuse) surveillance"
  - "surveillance (analyst|analytics|quant)"
  - "market abuse"
  - "regulatory analyst"
  - "regulation analyst"
  - "\\bremit\\b"

  # --- early career, whatever the discipline ---
  # The point of the whole exercise. These are collected on the strength of the
  # programme alone, because a graduate scheme rarely names the desk in its title.
  # Each of these must name the discipline as well as the stage. Unscoped,
  # "trainee" collects dental nurses and driving instructors, "apprentice"
  # collects chefs and plumbers, and "placement" collects nursing coordinators.
  - "graduate (scheme|programme|program|analyst|trader|developer|engineer)"
  - "analyst (programme|program|scheme)"
  - "(trading|commodit|energy|market|quant|research|finance|investment) intern"
  - "intern(ship)?.{0,24}(trading|commodit|energy|market|quant|research)"
  - "(industrial|commercial|finance|trading|analyst) placement|placement year"
  - "apprentice.{0,20}(trader|analyst|broker|dealer|trading)"
  - "trainee.{0,20}(trader|analyst|broker|dealer|quant)"
  - "(trading|commodit|energy|market|shipping|chartering).{0,20}trainee"
  - "entry.?level"
  - "early care"
  - "school leaver"
  - "off.?cycle"
  - "(summer|spring|winter|campus) (analyst|intern|programme|program)"
  - "new grad"
  - "rotational (programme|program|scheme)"

  # --- desk / front office ---
  - "trading analyst"
  - "trade analyst"
  - "desk analyst"
  - "junior trader"
  - "graduate trader"
  - "trainee trader"
  - "assistant trader"
  - "trader"
  - "trading (graduate|intern|programme|program|rotation)"
  - "front office"
  - "structur(er|ing) (analyst|associate|desk)|structured (products|commodit|finance)"
  - "origination (analyst|associate|desk)|(power|gas|energy|commodit).{0,20}origination"
  - "pricing analyst"
  - "execution (analyst|trader)"
  - "sales (and|&) trading"
  - "market mak"
  - "trading floor"
  - "commodity sales"
  - "physical trading"
  - "cargo (analyst|operations)"
  - "chartering (analyst|broker|trainee|desk|manager)|(dry cargo|tanker|freight) chartering"

  # --- quant ---
  - "quant(itative)? analyst"
  - "quant(itative)? research"
  - "quant(itative)? strateg"
  - "quant(itative)? develop"
  - "systematic (trading|research)"
  - "signals research"
  - "alpha research"
  - "strats"

  # --- data ---
  - "data scientist"
  - "data analyst"
  - "analytics engineer"
  - "machine learning (engineer|scientist)"
  - "data engineer"
  - "market data"
  - "python developer"
  - "trading systems"

exclude:
  - "senior"
  - "\\bsnr\\b"
  - "\\bsr\\.?\\b"
  - "head of"
  - "\\bhead\\b"
  - "director"
  - "vp\\b"
  - "vice president"
  - "principal"
  - "\\bchief\\b"
  - "\\bstaff\\b"
  - "\\bexpert\\b"
  - "lead\\b"
  - "team lead"
  - "manager"
  # level suffixes — "Data Scientist II" is a step above where you're aiming
  - "\\b(ii|iii|iv)\\b"
  # not a blanket "sales" — that also threw out "Sales and Trading Graduate
  # Programme", which is one of the front-office routes actually open to you
  - "sales (executive|manager|rep|representative|consultant|assistant|advisor|adviser)"
  - "account manager"
  - "account executive"
  - "business development"
  - "recruit"
  - "hr\\b"
  - "marketing"
  - "customer"
  - "support engineer"
  - "helpdesk"
  - "internal audit"
  - "compliance officer"
  - "credit risk"
  - "trade support"
  - "settlement"
  - "back office"
  - "middle office"
  - "clearing"
